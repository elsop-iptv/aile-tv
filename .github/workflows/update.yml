name: Listeyi guncelle

on:
  schedule:
    - cron: "0 3 * * *"   # her gun 03:00 UTC (Turkiye 06:00)
  workflow_dispatch:      # elle calistirma

concurrency: liste

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listeyi olustur
        env:
          GEO_TOLERANT: "1"
          PYTHONIOENCODING: utf-8
        run: python build_playlist.py playlist.new.m3u
      - name: Guvenlik kontrolu (cok az kanal varsa eski liste korunur)
        run: |
          n=$(grep -c '^#EXTINF' playlist.new.m3u || true)
          echo "Kanal sayisi: $n"
          if [ "$n" -lt 150 ]; then echo "Cok az kanal, eski liste korunuyor"; rm playlist.new.m3u; exit 0; fi
          mv playlist.new.m3u playlist.m3u
      - name: CNN Turk resmi linkini ekle
        env:
          PYTHONIOENCODING: utf-8
        run: python refresh_cnn.py playlist.m3u
      - name: Degistiyse kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Liste guncellendi: $(date -u +%F)"
          git push
