name: CNN Turk linkini yenile

on:
  schedule:
    - cron: "17 */2 * * *"   # her 2 saatte bir (sitenin linki ~3 saat gecerli)
  workflow_dispatch:

concurrency: liste

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yeni linki al
        env:
          PYTHONIOENCODING: utf-8
        run: python refresh_cnn.py playlist.m3u
      - name: Degistiyse kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet && exit 0
          git commit -m "CNN Turk linki yenilendi"
          git pull --rebase
          git push
